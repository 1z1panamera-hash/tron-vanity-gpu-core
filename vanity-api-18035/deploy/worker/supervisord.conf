[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/run/vanity-api-18035/supervisord.pid
childlogdir=/opt/vanity-api-18035/logs

[program:vanity18035-core]
command=/opt/vanity-api-18035/worker/bin/vanity18035_core_daemon --socket /run/vanity-api-18035/core.sock --age-bin /usr/bin/age --age-recipient-file /run/vanity-api-18035/age-recipient.txt --worker-db /opt/vanity-api-18035/data/worker.sqlite3
directory=/opt/vanity-api-18035/worker
priority=10
autostart=true
autorestart=true
startsecs=2
startretries=5
stopsignal=TERM
stopwaitsecs=15
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=HOME="/nonexistent"

[program:vanity18035-agent]
command=python3 -m vanity18035.worker_agent
directory=/opt/vanity-api-18035/worker
priority=20
autostart=true
autorestart=true
startsecs=2
startretries=5
stopsignal=TERM
stopwaitsecs=15
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=HOME="/nonexistent"
