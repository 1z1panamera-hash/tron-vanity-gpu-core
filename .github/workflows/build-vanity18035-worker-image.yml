name: Build Vanity 18035 Worker Image

on:
  workflow_dispatch:
  push:
    branches:
      - vanity-api-18035
    paths:
      - "Dockerfile.vanity18035-worker"
      - "vanity-api-18035/**"
      - "vanity-api-v2-core/results/rtx5090_round53_20260712/**"
      - ".github/workflows/build-vanity18035-worker-image.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.vanity18035-worker
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/tron-vanity-gpu-core:vanity18035-worker-latest
            ghcr.io/${{ github.repository_owner }}/tron-vanity-gpu-core:vanity18035-worker-${{ github.sha }}
