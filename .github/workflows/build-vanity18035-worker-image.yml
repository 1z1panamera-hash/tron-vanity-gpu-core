name: Build Vanity 18035 Worker Image

on:
  workflow_dispatch:
  push:
    branches:
      - vanity-api-18035
    paths:
      - "Dockerfile.vanity18035-worker"
      - "vanity-api-18035/pyproject.toml"
      - "vanity-api-18035/src/**"
      - "vanity-api-18035/deploy/worker/container-entrypoint.sh"
      - "vanity-api-18035/deploy/worker/supervisord.conf"
      - "vanity-api-v2-core/results/rtx5090_round53_20260712/vanity18035_core_daemon"
      - ".github/workflows/build-vanity18035-worker-image.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build worker image
        run: |
          docker build \
            --file Dockerfile.vanity18035-worker \
            --tag ghcr.io/${{ github.repository_owner }}/tron-vanity-gpu-core:vanity18035-worker-latest \
            --tag ghcr.io/${{ github.repository_owner }}/tron-vanity-gpu-core:vanity18035-worker-${{ github.sha }} \
            .

      - name: Validate runtime image without a GPU
        run: |
          image=ghcr.io/${{ github.repository_owner }}/tron-vanity-gpu-core:vanity18035-worker-${{ github.sha }}
          docker run --rm --entrypoint python3 "$image" -c \
            'import aiohttp, vanity18035.worker_agent, vanity18035.worker_config'
          docker run --rm --entrypoint python3 "$image" -c \
            'from supervisor.options import ServerOptions; options=ServerOptions(); options.realize(args=["-c", "/etc/vanity-api-18035/supervisord.conf"]); options.process_config()'
          docker run --rm --entrypoint /bin/bash "$image" -c \
            'set -e; ! ldd /opt/vanity-api-18035/worker/bin/vanity18035_core_daemon | grep -q "not found"; test "$(id -u vanity18035)" = 10001; ! find /opt/vanity-api-18035 /etc/vanity-api-18035 -type f \( -name "*.key" -o -name "*.pem" -o -name ".env" -o -iname "*identity*" -o -iname "*api_key*" \) | grep -q .'

      - name: Push worker image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/tron-vanity-gpu-core:vanity18035-worker-latest
          docker push ghcr.io/${{ github.repository_owner }}/tron-vanity-gpu-core:vanity18035-worker-${{ github.sha }}
